name: Build Rasta Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "admin.html"
      - "capacitor.config.json"
      - "package.json"
      - "assets/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Prepare web assets and launcher icon
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp admin.html www/admin.html
          cp -R assets www/assets
          printf '{"sha":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > www/version.json
          cp assets/rasta-icon.png resources/icon.png
          cp assets/rasta-icon.png assets/icon.png

      - name: Install npm dependencies
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package APK as ZIP
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Rasta-Fitness.apk
          cd release
          zip Rasta-Fitness-APK.zip Rasta-Fitness.apk

      - name: Upload installable APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Rasta-Fitness-APK-ZIP
          path: release/Rasta-Fitness-APK.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rasta Fitness Android build ${{ github.run_number }}
          body: |
            نسخه اندروید رَستا فیتنس.
            
            فایل ZIP شامل APK نصب اندروید است. پس از دانلود، فایل ZIP را استخراج و APK را با تأیید خود نصب کنید.
          files: release/Rasta-Fitness-APK.zip
          make_latest: true
