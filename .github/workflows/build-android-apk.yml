name: Build Rasta Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "capacitor.config.json"
      - "package.json"
      - "assets/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Prepare web assets and launcher icon
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          rsvg-convert -w 1024 -h 1024 assets/rasta-icon.svg > resources/icon.png
          cp assets/rasta-icon.svg www/rasta-icon.svg

      - name: Install npm dependencies
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: rasta-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
