name: Build Rasta Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "nutrition-bank.html"
      - "rasta-science-engine.js"
      - "rasta-core.js"
      - "recipe-detail.html"
      - "sw.js"
      - "admin.html"
      - "capacitor.config.json"
      - "package.json"
      - "assets/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      RASTA_KEYSTORE_BASE64: ${{ secrets.RASTA_KEYSTORE_BASE64 }}
      RASTA_KEYSTORE_PASSWORD: ${{ secrets.RASTA_KEYSTORE_PASSWORD }}
      RASTA_KEY_PASSWORD: ${{ secrets.RASTA_KEY_PASSWORD }}
      RASTA_KEY_ALIAS: ${{ vars.RASTA_KEY_ALIAS }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test Rasta shared core
        run: node tests/core.test.js
      - name: Test Rasta science engine
        run: node tests/science-engine.test.js
      - name: Validate application JavaScript syntax
        run: node tests/app-validation.test.js

      - name: Install Android build tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Prepare web assets and launcher icon
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp nutrition-bank.html www/nutrition-bank.html
          cp rasta-science-engine.js www/rasta-science-engine.js
          cp admin.html www/admin.html
          cp -R assets www/assets
          printf '{"sha":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > www/version.json
          cp assets/rasta-icon.png resources/icon.png
          cp assets/rasta-icon.png assets/icon.png

      - name: Install npm dependencies
        run: npm install

      - name: Generate Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Set Android version from package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION_CODE="$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.stdout.write(String(a*10000+b*100+c))" "$VERSION")"
          python3 - "$VERSION" "$VERSION_CODE" <<'PY'
          import re, sys
          from pathlib import Path
          version, code = sys.argv[1], sys.argv[2]
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, n1 = re.subn(r'(?m)^(\s*versionCode\s+)\d+', lambda m: m.group(1) + code, s, count=1)
          s, n2 = re.subn(r'(?m)^(\s*versionName\s+)[\'"][^\'"]*[\'"]', lambda m: m.group(1) + '"' + version + '"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not set Android versionCode/versionName")
          p.write_text(s)
          print(f"Android version: {version} (code {code})")
          PY

      - name: Prepare stable Android signing key
        if: ${{ env.RASTA_KEYSTORE_BASE64 != '' && env.RASTA_KEYSTORE_PASSWORD != '' && env.RASTA_KEY_PASSWORD != '' && env.RASTA_KEY_ALIAS != '' }}
        env:
          RASTA_KEYSTORE_BASE64: ${{ secrets.RASTA_KEYSTORE_BASE64 }}
          RASTA_KEYSTORE_PASSWORD: ${{ secrets.RASTA_KEYSTORE_PASSWORD }}
          RASTA_KEY_PASSWORD: ${{ secrets.RASTA_KEY_PASSWORD }}
          RASTA_KEY_ALIAS: ${{ vars.RASTA_KEY_ALIAS }}
        run: |
          echo "$RASTA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rasta-upload-key.jks"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          if marker not in s:
              raise SystemExit("Could not find Android buildTypes block")
          signing = """    signingConfigs {
              release {
                  storeFile file(System.getenv('RASTA_KEYSTORE_PATH'))
                  storePassword System.getenv('RASTA_KEYSTORE_PASSWORD')
                  keyAlias System.getenv('RASTA_KEY_ALIAS')
                  keyPassword System.getenv('RASTA_KEY_PASSWORD')
              }
          }

          """
          if "signingConfigs {" not in s:
              s = s.replace(marker, signing + marker, 1)
          release_marker = "        release {"
          if release_marker not in s:
              raise SystemExit("Could not find release build type")
          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(release_marker, release_marker + "\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
        shell: bash

      - name: Verify stable signing key and passwords
        if: ${{ env.RASTA_KEYSTORE_BASE64 != '' && env.RASTA_KEYSTORE_PASSWORD != '' && env.RASTA_KEY_PASSWORD != '' && env.RASTA_KEY_ALIAS != '' }}
        env:
          RASTA_KEYSTORE_PATH: ${{ runner.temp }}/rasta-upload-key.jks
          RASTA_KEYSTORE_PASSWORD: ${{ secrets.RASTA_KEYSTORE_PASSWORD }}
          RASTA_KEY_PASSWORD: ${{ secrets.RASTA_KEY_PASSWORD }}
          RASTA_KEY_ALIAS: ${{ vars.RASTA_KEY_ALIAS }}
        run: |
          cat > /tmp/VerifyRastaKey.java <<'JAVA'
          import java.io.InputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.PrivateKey;
          public class VerifyRastaKey {
            public static void main(String[] args) throws Exception {
              KeyStore ks = KeyStore.getInstance("JKS");
              try (InputStream in = Files.newInputStream(Path.of(System.getenv("RASTA_KEYSTORE_PATH")))) {
                ks.load(in, System.getenv("RASTA_KEYSTORE_PASSWORD").toCharArray());
              }
              String alias = System.getenv("RASTA_KEY_ALIAS");
              if (!ks.containsAlias(alias)) throw new IllegalStateException("STORE_PASSWORD_OK_BUT_ALIAS_NOT_FOUND");
              Key key = ks.getKey(alias, System.getenv("RASTA_KEY_PASSWORD").toCharArray());
              if (!(key instanceof PrivateKey)) throw new IllegalStateException("ALIAS_FOUND_BUT_PRIVATE_KEY_INVALID");
              System.out.println("SIGNING_KEY_VALIDATION_SUCCESS");
            }
          }
          JAVA
          javac /tmp/VerifyRastaKey.java
          java -cp /tmp VerifyRastaKey

      - name: Build signed release APK
        if: ${{ env.RASTA_KEYSTORE_BASE64 != '' && env.RASTA_KEYSTORE_PASSWORD != '' && env.RASTA_KEY_PASSWORD != '' && env.RASTA_KEY_ALIAS != '' }}
        working-directory: android
        env:
          RASTA_KEYSTORE_PATH: ${{ runner.temp }}/rasta-upload-key.jks
          RASTA_KEYSTORE_PASSWORD: ${{ secrets.RASTA_KEYSTORE_PASSWORD }}
          RASTA_KEY_PASSWORD: ${{ secrets.RASTA_KEY_PASSWORD }}
          RASTA_KEY_ALIAS: ${{ vars.RASTA_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build debug APK (temporary, not published as latest)
        if: ${{ env.RASTA_KEYSTORE_BASE64 == '' || env.RASTA_KEYSTORE_PASSWORD == '' || env.RASTA_KEY_PASSWORD == '' || env.RASTA_KEY_ALIAS == '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package APK as ZIP
        run: |
          mkdir -p release
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release/Rasta-Fitness.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release/Rasta-Fitness.apk
          fi
          cd release
          zip Rasta-Fitness-APK.zip Rasta-Fitness.apk

      - name: Upload installable APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Rasta-Fitness-APK-ZIP
          path: release/Rasta-Fitness-APK.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest signed APK release
        if: ${{ github.ref == 'refs/heads/main' && env.RASTA_KEYSTORE_BASE64 != '' && env.RASTA_KEYSTORE_PASSWORD != '' && env.RASTA_KEY_PASSWORD != '' && env.RASTA_KEY_ALIAS != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rasta Fitness v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            نسخه برنامه: v${{ env.APP_VERSION }}

            فایل‌های این انتشار در لینک دانلود ثابت آخرین نسخه قرار می‌گیرند.

            Commit: ${{ github.sha }}

            این نسخه با کلید ثابت رَستا امضا شده و برای نصب به‌روزرسانی روی نسخه قبلی که با همین کلید نصب شده مناسب است. فایل APK را با تأیید خود نصب کنید.
          files: |
            release/Rasta-Fitness-APK.zip
            release/Rasta-Fitness.apk
          make_latest: true
